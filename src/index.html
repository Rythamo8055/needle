<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Needle — System Info</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Needle <span>— DevOps Helper · 45M · 5 tools · 100%</span></h1>
      <p class="subtitle">Ask in plain English · FFI 110ms · 27MB</p>
    </header>

    <div class="search-row">
      <input id="query" type="text" placeholder="e.g. 'battery health', 'disk health', 'uptime'" />
      <button id="ask-btn">Ask</button>
    </div>

    <div class="quick">
      <button data-q="battery health">Battery</button>
      <button data-q="disk health">Disk Health</button>
      <button data-q="disk usage">Disk Usage</button>
      <button data-q="uptime">Uptime</button>
      <button data-q="hostname">Hostname</button>
    </div>

    <div id="status" class="status">Ready · 5 tools · 100% reliable</div>

    <div id="result" class="result">
      <div class="placeholder">Try “battery health” or “disk health”</div>
    </div>

    <!-- Sudo modal -->
    <div id="sudo-modal" class="modal hidden">
      <div class="modal-box">
        <h3>Sudo Required</h3>
        <p>This tool needs admin access. Enter your password.</p>
        <input id="sudo-pass" type="password" placeholder="Password" />
        <div class="modal-actions">
          <button id="sudo-cancel">Cancel</button>
          <button id="sudo-ok" class="primary">Unlock</button>
        </div>
        <p id="sudo-error" class="error hidden">Wrong password</p>
      </div>
    </div>
  </body>
</html>
